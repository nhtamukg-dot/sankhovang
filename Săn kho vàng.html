<style>
:root{color-scheme:dark;--bg:#17152b;--panel:#24213d;--panel2:#302b50;--ink:#fff8e9;--mut:#c2badb;--gold:#ffc857;--pink:#ff6685;--cyan:#5de0d0;--line:#494268;--green:#62d6a5;--red:#ff6b6b}

.card{background:linear-gradient(145deg,#2b2748,#211f38);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 35px #08071655;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{border:0;border-radius:14px;padding:11px 19px;background:linear-gradient(135deg,#ffb84d,#ff6c7d);color:#25152c;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #a9475c;margin:6px 7px 0 0}.btn.secondary{background:linear-gradient(135deg,#67e4d2,#5c9bff);box-shadow:0 4px 0 #345a9d}.btn.ghost{background:#ffffff12;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.sm{font-size:13px;padding:6px 10px;box-shadow:none;margin:2px 4px 2px 0}.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{background:#17152b;color:var(--ink);border:1px solid var(--line);padding:12px;border-radius:12px;font:inherit;width:100%;margin:5px 0 12px}label{font-weight:700;font-size:13px;color:var(--mut)}
.team-tile{background:#ffffff0b;border:1px solid var(--line);border-radius:16px;padding:15px}.team-tile strong{font-size:18px}.score{font:800 34px "Baloo 2";color:var(--gold)}.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#5de0d01c;color:var(--cyan);font-size:12px;font-weight:700}.hero{text-align:center;padding:25px 12px}.hero .emoji{font-size:58px}.hero p{max-width:650px;margin:10px auto;color:var(--mut)}
.progress{height:9px;background:#ffffff16;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));width:0;transition:width .3s}
.statrow{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:130px;background:#ffffff0b;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font:800 27px "Baloo 2";color:var(--gold)}
.question{font-size:20px;font-weight:800;margin:12px 0}.choice{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:14px;border:2px solid var(--line);background:#ffffff09;color:var(--ink);font:600 15px inherit;margin:9px 0;cursor:pointer}.choice:hover{border-color:var(--cyan)}.choice.correct{border-color:var(--green);background:#62d6a51c}.choice.wrong{border-color:var(--red);background:#ff6b6b1c}.feedback{padding:13px;border-radius:13px;background:#5de0d015;border-left:4px solid var(--cyan);margin-top:12px}

.notice{border:1px dashed #806dba;border-radius:14px;padding:12px;color:var(--mut);font-size:13px}.hide{display:none!important}.mapbox{background:#17152b;border-radius:16px;padding:10px;border:1px solid var(--line)}svg{width:100%;max-width:430px;display:block;margin:auto;touch-action:none}.sliderrow{display:flex;align-items:center;gap:10px}.sliderrow input{padding:0;accent-color:var(--gold)}.answerrow{display:flex;gap:10px;flex-wrap:wrap}.answerrow>*{flex:1;min-width:100px}
.topright{display:flex;align-items:center;gap:8px}.mute{background:#ffffff13;border:1px solid var(--line);color:var(--ink);border-radius:99px;width:34px;height:34px;font-size:16px;line-height:1;cursor:pointer;padding:0}.mute:hover{border-color:var(--cyan)}.mute:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

<div class="wrap">
  <header class="top">
    <div><div class="brand">🏭 LOGISTICS CHALLENGE</div><h1>Vòng 2: Săn kho vàng</h1><div class="muted">7 đội tranh tài · Tìm vị trí kho tối ưu · Chinh phục bảng vàng</div></div>
    <div class="topright"><div class="tag">✨ TEAM BATTLE · WEB GAME</div><button id="muteBtn" class="mute" type="button" aria-label="Bật hoặc tắt âm thanh" aria-pressed="false">🔊</button></div>
  </header>

<script>
const KEY='sanKhoVang_7doi_v4';
let DEVICE;try{DEVICE=localStorage.getItem('skv_dev');if(!DEVICE){DEVICE='d'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('skv_dev',DEVICE)}}catch(e){DEVICE='d'+Math.random().toString(36).slice(2,10)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ===== Âm thanh: Web Audio API, không dùng file ngoài ===== */
const Snd=(()=>{
 let ctx=null,master,musicG,sfxG,noiseBuf,muted=false,want=false,timer=null,nextT=0,step=0,lastTick=-1;
 try{muted=localStorage.getItem('skv_mute')==='1'}catch(e){}
 const SD=60/126/4;
 const CH=[[523.25,659.25,783.99],[440,523.25,659.25],[523.25,698.46,880],[493.88,587.33,783.99]];
 const BASS=[130.81,110,87.31,98];
 const ARP={0:0,2:1,3:2,6:1,8:2,10:1,11:0,14:2};
 function init(){
  try{
   if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:1;master.connect(ctx.destination);
    musicG=ctx.createGain();musicG.gain.value=.17;musicG.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=.55;sfxG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   }
   if(ctx.state==='suspended')ctx.resume();
   return true;
  }catch(e){return false}
 }
 function tone(f,t,dur,type,vol,dest,f2){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.008,dur/3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);
 }
 function noise(t,dur,vol,type,freq,dest){
  const n=ctx.createBufferSource();n.buffer=noiseBuf;
  const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(dest);n.start(t);n.stop(t+dur+.02);
 }
 function sched(i,t){
  const bar=(i>>4)&3,k=i&15;
  if(k%4===0){tone(150,t,.16,'sine',.9,musicG,42)}
  if(k===4||k===12){noise(t,.12,.45,'bandpass',1800,musicG)}
  if(k%2===1||k===2||k===10){noise(t,.04,.18,'highpass',7000,musicG)}
  if(k%2===0){tone(k%4===2?BASS[bar]*2:BASS[bar],t,SD*1.7,'triangle',.5,musicG)}
  if(k===2||k===6||k===10||k===14){CH[bar].forEach(f=>tone(f/2,t,SD*1.4,'triangle',.07,musicG))}
  if(ARP[k]!==undefined){tone(CH[bar][ARP[k]]*2,t,SD*1.5,'square',.045,musicG)}
 }
 function pump(){
  if(!ctx)return;
  if(nextT<ctx.currentTime-.2)nextT=ctx.currentTime+.05;
  while(nextT<ctx.currentTime+.18){sched(step,nextT);nextT+=SD;step=(step+1)%64}
 }
 function startLoop(){if(timer||!ctx||muted)return;nextT=ctx.currentTime+.06;timer=setInterval(pump,40)}
 function stopLoop(){if(timer){clearInterval(timer);timer=null}}
 return {
  unlock(){init()},
  music(on){
   want=on;
   if(!on){stopLoop();return}
   if(init())startLoop();
  },
  isMuted(){return muted},
  setMuted(m){
   muted=m;try{localStorage.setItem('skv_mute',m?'1':'0')}catch(e){}
   if(!ctx)return;
   master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(m?0:1,ctx.currentTime,.03);
   if(m)stopLoop();else if(want)startLoop();
  },
  click(){if(muted||!init())return;const t=ctx.currentTime;tone(1100,t,.05,'triangle',.3,sfxG,650);noise(t,.02,.12,'highpass',5000,sfxG)},
  countdown(left){
   if(muted||!init())return;
   const n=left>=8?1:left>=5?2:left>=3?3:4,base=t0=>t0,t=ctx.currentTime+.02,pitch=1+(10-left)*.045;
   for(let i=0;i<n;i++){
    const at=t+i/n,hi=(i+left)%2===0;
    tone((hi?1500:1150)*pitch,at,.045,'square',.2+(10-left)*.015,sfxG);
    noise(at,.025,.18,'bandpass',3000,sfxG);
   }
  },
  ding(bonus,delay){
   if(muted||!init())return;
   const t=ctx.currentTime+(delay||0);
   [[987.77,0],[1318.5,.1]].forEach(([f,d])=>{tone(f,t+d,.45,'sine',.45,sfxG);tone(f*2,t+d,.25,'triangle',.18,sfxG)});
   if(bonus)[1567.98,1975.53,2637].forEach((f,i)=>tone(f,t+.28+i*.07,.3,'sine',.3,sfxG));
  },
  buzz(){
   if(muted||!init())return;
   const t=ctx.currentTime,lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.connect(sfxG);
   tone(120,t,.38,'sawtooth',.5,lp,70);tone(90,t,.38,'square',.25,lp,55);
  },
  fanfare(){
   if(muted||!init())return;
   const t=ctx.currentTime+.05,lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.connect(sfxG);
   if(musicG){musicG.gain.cancelScheduledValues(t);musicG.gain.setTargetAtTime(.05,t,.05);musicG.gain.setTargetAtTime(.17,t+3.6,.4)}
   [[523.25,0,.14],[659.25,.14,.14],[783.99,.28,.14],[1046.5,.45,.5]].forEach(([f,d,l])=>{tone(f,t+d,l,'sawtooth',.22,lp);tone(f/2,t+d,l,'square',.08,lp)});
   [[783.99,1.05],[1046.5,1.05],[1318.5,1.05]].forEach(([f,d])=>tone(f,t+d,.9,'sawtooth',.16,lp));
   [2093,2637,3136,4186].forEach((f,i)=>tone(f,t+1.1+i*.08,.35,'sine',.18,sfxG));
  }
 };
})();
function syncMute(){const b=document.getElementById('muteBtn');if(!b)return;const m=Snd.isMuted();b.textContent=m?'🔇':'🔊';b.setAttribute('aria-pressed',m?'true':'false');b.title=m?'Bật âm thanh':'Tắt âm thanh'}
document.getElementById('muteBtn').onclick=e=>{e.stopPropagation();Snd.unlock();Snd.setMuted(!Snd.isMuted());syncMute();if(!Snd.isMuted())Snd.click()};
document.addEventListener('pointerdown',()=>Snd.unlock(),{once:true,capture:true});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&b.id!=='muteBtn')Snd.click()},true);
syncMute();

const TEAMS=[1,2,3,4,5,6,8].map(n=>({id:n,name:'Đội '+n}));
const HOST_PIN='2026'; // Chủ trì có thể đổi mã PIN tại đây
const P=[["CH1",2,8,.60],["CH2",6,7,.50],["CH3",8,3,.40],["CH4",3,2,.45],["CH5",10,6,.55]];
const LN=["A - Bình Tân","B - Thủ Đức","C - Hóc Môn"];
const V=[10.62,10.094,11.714].map(z=>z*365*.05), FF=[220,260,180];
const BE=(FF[0]-FF[2])/(V[2]-V[0]);
let timedOut=false,state=loadState(),activeTeam=null,stage=0,pointsThisRun=0,timerInt=null,timeLeft=0,answerLocked=false;
const app=document.getElementById('app');
let DB=null,syncOn=false,syncErr=false,armed=null;
const wq={};
function pushTeam(t){
 if(!DB||!t)return;
 const q=wq[t.id]||(wq[t.id]={busy:false,next:null});
 q.next={id:t.id,name:t.name,score:t.score,done:!!t.done,stage:t.stage||0,joined:!!t.joined,pts:t.pts||[null,null,null],owner:t.owner||null,updated:t.updated||null,ts:Date.now()};
 if(q.busy)return;
 q.busy=true;
 (async()=>{
  while(q.next){
   const d=q.next;q.next=null;
   try{await DB.collection('teams').doc('t'+d.id).set(d);if(syncErr){syncErr=false;syncBadge()}}
   catch(e){syncErr=true;syncBadge()}
  }
  q.busy=false;
 })();
}
function syncBadge(){
 const txt=syncErr?'🔴 Không ghi được lên máy chủ (cần quyền Contributor)':syncOn?'🟢 Đồng bộ trực tiếp':'🟠 Chỉ lưu trên máy này';
 document.querySelectorAll('.syncTag').forEach(el=>{el.textContent=txt});
}
function applySnap(docs){
 let kicked=false;
 docs.forEach(d=>{if(!d.exists)return;const v=d.data(),t=state.teams.find(x=>x.id===v.id);if(!t)return;
  if(t.id===activeTeam){if(!d.metadata.fromCache&&v.owner!==DEVICE)kicked=true;return}
  Object.assign(t,{score:v.score||0,pts:v.pts||[null,null,null],done:!!v.done,stage:v.stage||0,joined:!!v.joined,owner:v.owner||null,updated:v.updated||null})});
 save();
 if(kicked){kickOut();return}
 if(document.getElementById('scores'))renderHostRows();else{updateMiniScore();refreshSelect()}
}
function kickOut(){stopTimer();activeTeam=null;home('Chủ trì đã giải phóng hoặc đặt lại đội này nên bạn được đưa về màn hình đầu. Hãy chọn lại đúng đội của mình.')}
function startSync(tries){
 tries=tries||0;
 if(!(window.claude&&window.claude.use)){if(tries<20)setTimeout(()=>startSync(tries+1),500);return}
 window.claude.use('db').then(db=>{
  if(!db)return;
  DB=db;syncOn=true;syncBadge();
  DB.collection('teams').onSnapshot(snap=>applySnap(snap.docs),()=>{syncOn=false;syncBadge()});
 }).catch(()=>{});
}
function setStage(n){let t=team();t.stage=n;t.joined=true;save();pushTeam(t)}
function statusHTML(t){return t.done?'<span class="pill">✅ Hoàn thành</span>':t.stage>=1?`<span class="pill" style="background:#ffc85722;color:var(--gold)">▶ Đang làm thử thách ${t.stage}/3</span>`:t.joined?'<span class="muted">Đã vào, chờ bắt đầu</span>':'<span class="muted">Chưa vào</span>'}
function hostRowsHTML(){return state.teams.slice().sort((a,b)=>b.score-a.score||a.id-b.id).map((t,i)=>`<tr><td><span class="rank">${['🥇','🥈','🥉'][i]||'🏅'}</span> ${esc(t.name)}</td><td><b style="font-size:20px;color:var(--gold)">${t.score}</b></td><td>${statusHTML(t)}</td><td>${t.updated||'—'}</td><td><button class="btn ghost sm" data-k="rel${t.id}">${isArmed('rel'+t.id)?'Xác nhận?':'Giải phóng'}</button><button class="btn ghost sm" data-k="rst${t.id}">${isArmed('rst'+t.id)?'Xác nhận?':'Đặt lại'}</button></td></tr>`).join('')}
function renderHostRows(){let b=document.getElementById('scores');if(!b)return;b.innerHTML=hostRowsHTML();document.getElementById('doneCount').textContent=state.teams.filter(t=>t.done).length+'/7';document.getElementById('sum').textContent=state.teams.reduce((a,t)=>a+t.score,0);let p=document.getElementById('playCount');if(p)p.textContent=state.teams.filter(t=>!t.done&&t.stage>=1).length;let r=document.getElementById('reset');if(r)r.textContent=isArmed('all')?'Bấm lần nữa để xác nhận':'Đặt lại điểm 7 đội'}
function isArmed(k){return !!(armed&&armed.key===k&&Date.now()<armed.until)}
function blank(){return {teams:TEAMS.map(t=>({id:t.id,name:t.name,score:0,pts:[null,null,null],done:false,updated:null,stage:0,joined:false,owner:null})),history:[],started:false}}
function loadState(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.teams?.length===7&&s.teams.every((t,i)=>t.id===TEAMS[i].id)){s.teams.forEach(t=>{t.pts=t.pts||[null,null,null];t.owner=t.owner||null});return s}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function team(){return state.teams.find(t=>t.id===activeTeam)}
function fmt(n,d=2){return Number(n).toFixed(d).replace('.',',')}
function dist(x,y,p){return Math.hypot(x-p[1],y-p[2])}
function cost(x,y){return P.reduce((s,p)=>s+p[3]*dist(x,y,p),0)}
let gx=5,gy=5;for(let k=0;k<5000;k++){let nx=0,ny=0,d=0;P.forEach(p=>{let w=p[3]/(dist(gx,gy,p)||1e-9);nx+=p[1]*w;ny+=p[2]*w;d+=w});gx=nx/d;gy=ny/d}
const ZS=cost(gx,gy);
function addPoints(n,label,idx,bonus){let t=team();if(!t)return;if(t.pts[idx]!==null&&t.pts[idx]!==undefined)return;if(n>0)Snd.ding(!!bonus,timedOut?.4:0);else if(!timedOut)Snd.buzz();t.pts[idx]=n;t.score=t.pts.reduce((a,b)=>a+(b||0),0);t.updated=new Date().toLocaleTimeString('vi-VN');pointsThisRun+=n;state.history.push({team:t.name,points:n,label,time:Date.now()});save();pushTeam(t);updateMiniScore()}
function updateMiniScore(){let el=document.getElementById('myScore');if(el&&team())el.textContent=team().score+' điểm'}
function stopTimer(){if(timerInt)clearInterval(timerInt);timerInt=null}
function startTimer(seconds,onEnd){stopTimer();timedOut=false;timeLeft=seconds;renderTimer();timerInt=setInterval(()=>{timeLeft--;renderTimer();if(timeLeft<=0){stopTimer();timedOut=true;Snd.buzz();onEnd()}else if(timeLeft<=10)Snd.countdown(timeLeft)},1000)}
function renderTimer(){let el=document.getElementById('timer');if(el){el.textContent='⏱ '+timeLeft+'s';el.classList.toggle('danger',timeLeft<=5)}}
function teamOptions(){return state.teams.map(t=>{const taken=t.owner&&t.owner!==DEVICE,mine=t.owner===DEVICE;return `<option value="${t.id}" ${taken?'disabled':''}>${esc(t.name)}${taken&&!t.done?' · đang có người chơi':mine?' · thiết bị này':''}</option>`}).join('')}
function refreshSelect(){const el=document.getElementById('teamSelect');if(!el)return;const v=el.value;el.innerHTML=teamOptions();el.value=v}
function home(msg){
 Snd.music(false);stopTimer();activeTeam=null;
 app.innerHTML=`${msg?`<div class="notice" style="border-color:var(--red);color:var(--ink);margin-top:14px">${esc(msg)}</div>`:''}<section class="card hero"><div class="emoji">🗝️💰</div><h2>Chào mừng đến với Săn kho vàng!</h2><p>7 đội sẽ cùng giải các thử thách logistics. Mỗi đội có bảng điểm riêng; chủ trì có bảng tổng hợp để theo dõi toàn bộ cuộc chơi.</p></section>
 <div class="grid">
  <section class="card"><h2>🎮 Đội chơi</h2><p class="muted">Chọn đúng đội của bạn. Đội đã có người chơi sẽ bị khóa để tránh vào nhầm. Không cần đủ 7 đội mới bắt đầu được.</p><label>Chọn đội</label><select id="teamSelect">${teamOptions()}</select><button class="btn" id="join">Vào cuộc 🚀</button></section>
  <section class="card"><h2>👑 Khu vực chủ trì</h2><p class="muted">Xem điểm, thứ hạng, tiến độ của cả 7 đội và quản lý cuộc chơi.</p><label>Mã PIN chủ trì</label><input id="pin" type="password" placeholder="Nhập mã PIN"><button class="btn secondary" id="host">Mở bảng điều khiển</button></section>
 </div>
 <div class="notice"><span class="syncTag"></span> · Khi hiện 🟢, điểm của đội được gửi thẳng lên bảng điều khiển của chủ trì. Nếu hiện 🟠 thì điểm chỉ lưu trên máy này và chủ trì sẽ không thấy.</div>`;
 document.getElementById('join').onclick=()=>{Snd.music(true);confirmTeam(+document.getElementById('teamSelect').value)};
 document.getElementById('host').onclick=()=>{if(document.getElementById('pin').value===HOST_PIN)hostPanel();else alert('Mã PIN chưa đúng!')};syncBadge();
}
async function claim(id){
 for(let i=0;i<15&&!DB;i++)await sleep(200);
 if(!DB)return {ok:true};
 const ref=DB.collection('teams').doc('t'+id);
 let cur=null;
 try{const sn=await ref.get();cur=sn.exists?sn.data():null}catch(e){return {ok:true}}
 if(cur&&cur.owner&&cur.owner!==DEVICE)return {ok:false,why:cur.done?'done':'taken'};
 const base=cur||{};
 const d={id,name:'Đội '+id,score:base.score||0,pts:base.pts||[null,null,null],done:!!base.done,stage:base.stage||0,joined:true,owner:DEVICE,updated:base.updated||null,ts:Date.now()};
 try{await ref.set(d)}catch(e){syncErr=true;syncBadge();return {ok:true}}
 await sleep(700);
 let chk=d;
 try{const sn=await ref.get();if(sn.exists)chk=sn.data()}catch(e){}
 if(chk.owner&&chk.owner!==DEVICE)return {ok:false,why:chk.done?'done':'taken'};
 return {ok:true,data:chk};
}
function confirmTeam(id){
 const name=TEAMS.find(t=>t.id===id).name;
 app.innerHTML=`<section class="card hero"><div class="emoji">🤔</div><h2>Bạn đang vào ${esc(name)}</h2><p>Hãy chắc chắn đây là đội của bạn. Sau khi vào, thiết bị khác không chọn được đội này nữa. Nếu lỡ chọn nhầm, bấm "Thoát" ở màn hình tiếp theo trước khi chơi.</p><button class="btn" id="yes">Đúng, vào ${esc(name)} ✅</button><button class="btn ghost" id="no">Chọn lại</button></section>`;
 document.getElementById('no').onclick=()=>home();
 const yes=document.getElementById('yes');
 yes.onclick=async()=>{
  yes.disabled=true;yes.textContent='Đang kiểm tra...';
  const r=await claim(id);
  if(!r.ok){home(r.why==='done'?`${name} đã hoàn thành rồi. Hãy chọn đúng đội của bạn. Nếu cần chơi lại, nhờ chủ trì bấm Đặt lại cho đội này.`:`${name} đang được thiết bị khác chơi. Nếu đó không phải đội của bạn, hãy chọn đúng đội. Nếu máy cũ bị hỏng hoặc bấm nhầm, nhờ chủ trì bấm Giải phóng.`);return}
  activeTeam=id;pointsThisRun=0;const t=team();
  if(r.data)Object.assign(t,{score:r.data.score||0,pts:r.data.pts||[null,null,null],done:!!r.data.done,stage:r.data.stage||0,joined:true,owner:DEVICE,updated:r.data.updated||null});
  else{t.joined=true;t.owner=DEVICE;t.pts=t.pts||[null,null,null]}
  save();
  if(t.done||t.pts.every(x=>x!==null)){endGame();return}
  intro();
 };
}
function intro(){
 const t=team(),got=t.pts.filter(x=>x!==null).length;
 app.innerHTML=`<section class="card hero"><div class="tag">ĐANG THI ĐẤU · ${team().name.toUpperCase()}</div> <span class="tag syncTag"></span><div class="emoji">🧭</div><h2>Đội ${activeTeam} – Sẵn sàng săn kho!</h2><p>Nhiệm vụ: tìm vị trí kho trung tâm tối ưu, xác định điểm hòa vốn và chọn phương án kho phù hợp. Mỗi thử thách chỉ có 20 giây, hãy phối hợp nhanh và chính xác.</p><div class="statrow"><div class="stat"><span class="muted">Điểm hiện tại</span><b id="myScore">${t.score}</b></div><div class="stat"><span class="muted">Số thử thách</span><b>${got}/3</b></div><div class="stat"><span class="muted">Điểm tối đa</span><b>15</b></div></div><button class="btn" id="start">${got?'Tiếp tục nhiệm vụ '+(got+1)+' ⚡':'Bắt đầu nhiệm vụ 1 ⚡'}</button><button class="btn ghost" id="back">Thoát</button></section>`;
 syncBadge();
 document.getElementById('start').onclick=()=>{Snd.music(true);[weber,breakEven,finalChoice][t.pts.findIndex(x=>x===null)]()};
 document.getElementById('back').onclick=()=>{if(!got){t.owner=null;t.joined=false;t.stage=0;save();pushTeam(t)}home()};
}
function header(n,title){return `<div class="top"><div><div class="tag">${team().name} · THỬ THÁCH ${n}/3</div><h2>${title}</h2></div><div class="stat"><span class="muted">Điểm đội</span><b id="myScore">${team().score}</b></div></div><div class="progress"><i style="width:${(n-1)/3*100}%"></i></div>`}
function weber(){
 stage=1;setStage(1);answerLocked=false;let x=5,y=5,locked=false;
 app.innerHTML=`<section class="card">${header(1,'📍 Định vị kho trung tâm')}<p class="muted">Kéo biểu tượng 🏭 trên bản đồ hoặc điều chỉnh thanh X, Y. Mục tiêu là làm tổng Q × D nhỏ nhất.</p><div class="mapbox"><svg id="map" viewBox="0 0 320 320"></svg></div><div class="statrow"><div class="stat">Tọa độ X<b id="vx">5,00</b></div><div class="stat">Tọa độ Y<b id="vy">5,00</b></div><div class="stat">Tổng Z<b id="z">—</b></div></div><div class="sliderrow">X <input id="sx" type="range" min="0" max="10" step=".05" value="5"></div><div class="sliderrow">Y <input id="sy" type="range" min="0" max="10" step=".05" value="5"></div><div class="top"><span class="muted">Nhiệt kế: càng nóng càng gần đáp án 🔥</span><span id="heat" class="pill">Đang dò tìm</span></div><div class="progress"><i id="therm"></i></div><div class="top"><span class="timer" id="timer">⏱ 20s</span><span class="muted">Tối đa 5 điểm · Có thưởng tốc độ</span></div><button class="btn" id="lock">Chốt tọa độ kho 📌</button><div id="fb"></div></section>`;
 const map=document.getElementById('map'),X=v=>20+v*28,Y=v=>300-v*28;
 function draw(){let s='';for(let i=0;i<=10;i+=2)s+=`<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(10)}" stroke="#494268"/><line x1="${X(0)}" y1="${Y(i)}" x2="${X(10)}" y2="${Y(i)}" stroke="#494268"/>`;
 P.forEach(p=>s+=`<line x1="${X(x)}" y1="${Y(y)}" x2="${X(p[1])}" y2="${Y(p[2])}" stroke="#ff6685" stroke-opacity=".55" stroke-width="${p[3]*7}" stroke-dasharray="5 4"/>`);
 P.forEach(p=>s+=`<text x="${X(p[1])}" y="${Y(p[2])+8}" font-size="20" text-anchor="middle">🏪</text><text x="${X(p[1])}" y="${Y(p[2])+24}" font-size="9" text-anchor="middle" fill="#fff">${p[0]}</text>`);
 s+=`<text x="${X(x)}" y="${Y(y)+10}" font-size="28" text-anchor="middle">🏭</text>`;map.innerHTML=s;
 let z=cost(x,y),ratio=z/ZS,pct=Math.max(0,Math.min(100,100-(ratio-1)*500));document.getElementById('vx').textContent=fmt(x);document.getElementById('vy').textContent=fmt(y);document.getElementById('z').textContent=fmt(z,3);document.getElementById('therm').style.width=pct+'%';document.getElementById('heat').textContent=ratio<1.01?'🔥 Rất nóng':ratio<1.03?'🌤 Khá gần':'🧊 Còn xa';
 }
 function setPos(nx,ny){if(locked)return;x=Math.max(0,Math.min(10,nx));y=Math.max(0,Math.min(10,ny));document.getElementById('sx').value=x;document.getElementById('sy').value=y;draw()}
 map.onpointerdown=e=>{if(locked)return;map.setPointerCapture(e.pointerId);move(e)};map.onpointermove=e=>{if(e.buttons)move(e)};
 function move(e){let r=map.getBoundingClientRect();setPos(Math.round((((e.clientX-r.left)/r.width*320-20)/28)*20)/20,Math.round(((300-(e.clientY-r.top)/r.height*320)/28)*20)/20)}
 document.getElementById('sx').oninput=e=>setPos(+e.target.value,y);document.getElementById('sy').oninput=e=>setPos(x,+e.target.value);
 function finish(){if(locked)return;locked=true;stopTimer();document.getElementById('sx').disabled=document.getElementById('sy').disabled=true;document.getElementById('lock').disabled=true;
 let okx=Math.abs(x-gx)<=.1,oky=Math.abs(y-gy)<=.1,pts=okx&&oky?5:(okx||oky)?2:0,bonus=timeLeft>10&&pts===5?1:0;addPoints(pts+bonus,'Định vị kho',0,bonus);draw();
 document.getElementById('fb').innerHTML=`<div class="feedback"><b>${pts+bonus} điểm!</b> ${bonus?'Có thêm 1 điểm thưởng tốc độ. ':''}Đáp án gần đúng: X = ${fmt(gx,2)}, Y = ${fmt(gy,2)}; Z = ${fmt(ZS,3)} tấn·km/ngày. Bạn được ${pts} điểm cơ bản${bonus?' + 1 điểm tốc độ':''}.</div><button class="btn" id="next">Qua nhiệm vụ 2 ➜</button>`;document.getElementById('next').onclick=breakEven}
 document.getElementById('lock').onclick=finish;draw();startTimer(20,()=>{document.getElementById('lock').textContent='Hết giờ – chốt kết quả';finish()});
}
function breakEven(){
 stage=2;setStage(2);answerLocked=false;let x=1;
 app.innerHTML=`<section class="card">${header(2,'⚖️ Cuộc đua hòa vốn')}<p class="muted">Điều chỉnh hệ số nhu cầu x để tìm điểm mà kho A và kho C có tổng chi phí bằng nhau. Đội có 20 giây!</p><div class="question">Ở mức nhu cầu nào, kho A và kho C có chi phí bằng nhau?</div><div class="sliderrow">Hệ số x <input id="sl" type="range" min="0" max="5" step=".01" value="1"></div><div class="statrow"><div class="stat">Hệ số đang chọn<b id="xv">1,00</b></div><div class="stat">Điểm hòa vốn<b>${fmt(BE,2)} lần</b></div></div><div id="bars"></div><div class="top"><span class="timer" id="timer">⏱ 20s</span><span class="pill">Tối đa 5 điểm</span></div><button class="btn" id="lock">Chốt điểm hòa vốn 🎯</button><div id="fb"></div></section>`;
 function costs(i,v){return FF[i]+V[i]*v}
 function draw(){let vals=LN.map((_,i)=>costs(i,x)),max=Math.max(...vals);document.getElementById('xv').textContent=fmt(x);document.getElementById('bars').innerHTML=vals.map((v,i)=>`<div style="margin:12px 0"><div class="top"><b>${LN[i]}</b><span>${fmt(v,1)} triệu</span></div><div class="progress"><i style="width:${v/max*100}%;background:${i===vals.indexOf(Math.min(...vals))?'var(--cyan)':'var(--gold)'}"></i></div></div>`).join('')}
 document.getElementById('sl').oninput=e=>{x=+e.target.value;draw()};draw();
 function finish(){if(answerLocked)return;answerLocked=true;stopTimer();document.getElementById('lock').disabled=true;document.getElementById('sl').disabled=true;let d=Math.abs(x-BE),pts=d<=.05?5:d<=.2?3:d<=.5?1:0,bonus=timeLeft>10&&pts===5?1:0;addPoints(pts+bonus,'Điểm hòa vốn',1,bonus);document.getElementById('fb').innerHTML=`<div class="feedback"><b>${pts+bonus} điểm!</b> Điểm hòa vốn chuẩn là x = ${fmt(BE,2)} lần nhu cầu hiện tại. ${bonus?'Thưởng tốc độ +1 điểm.':''}</div><button class="btn" id="next">Qua nhiệm vụ 3 ➜</button>`;document.getElementById('next').onclick=finalChoice}
 document.getElementById('lock').onclick=finish;startTimer(20,finish);
}
function finalChoice(){
 stage=3;setStage(3);answerLocked=false;
 app.innerHTML=`<section class="card">${header(3,'👑 Quyết định của giám đốc')}<div class="tag">THỬ THÁCH CUỐI · 20 GIÂY</div><div class="question">Với nhu cầu hiện tại (x = 1), đội sẽ chọn kho nào để có tổng chi phí thấp nhất?</div><div id="opts"></div><div class="top"><span class="timer" id="timer">⏱ 20s</span><span class="pill">2 điểm + 1 điểm tốc độ</span></div><div id="fb"></div></section>`;
 LN.forEach((n,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=n+' – '+fmt(FF[i]+V[i],1)+' triệu đồng';b.onclick=()=>choose(i);document.getElementById('opts').appendChild(b)});
 function choose(i){if(answerLocked)return;answerLocked=true;stopTimer();let correct=i===2,bonus=timeLeft>10&&correct?1:0,pts=correct?2+bonus:0;addPoints(pts,'Chọn vị trí kho',2,bonus);document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===2)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('fb').innerHTML=`<div class="feedback"><b>${correct?'Chính xác! +'+pts+' điểm':'Chưa chính xác – +0 điểm'}</b> Kho C – Hóc Môn có tổng chi phí thấp nhất ở nhu cầu hiện tại (${fmt(FF[2]+V[2],1)} triệu đồng). ${bonus?'Bạn nhận thêm 1 điểm tốc độ!':''}</div><button class="btn" id="finish">Nộp kết quả 🏆</button>`;document.getElementById('finish').onclick=endGame}
 startTimer(20,()=>choose(-1));
}
function endGame(){stopTimer();Snd.fanfare();team().done=true;team().stage=3;save();pushTeam(team());let s=team().score,rank=s>=13?'🏆 Chiến thần logistics':s>=9?'🥇 Chuyên gia kho vận':s>=5?'📦 Nhà thám hiểm kho':'🐣 Tân binh logistics';
 app.innerHTML=`<section class="card hero"><div class="emoji">🎉🏆</div><div class="tag">${team().name} ĐÃ HOÀN THÀNH</div><h2>${rank}</h2><div class="score">${s} điểm</div><p>Đội đã hoàn thành 3 thử thách của vòng Săn kho vàng. Hãy chờ chủ trì công bố kết quả chung cuộc!</p><button class="btn" id="home">Về màn hình đầu</button></section>`;
 document.getElementById('home').onclick=home}
function resetTeam(t){t.pts=[null,null,null];t.score=0;t.done=false;t.stage=0;t.joined=false;t.owner=null;t.updated=null}
function hostAction(k){
 if(k==='all'){state.teams.forEach(t=>{resetTeam(t);pushTeam(t)});state.history=[];save();return}
 const t=state.teams.find(x=>x.id===+k.slice(3));if(!t)return;
 if(k.startsWith('rel')){t.owner=null;t.joined=false;t.stage=t.done?3:0}else resetTeam(t);
 save();pushTeam(t);
}
function armClick(k){
 if(isArmed(k)){armed=null;hostAction(k);renderHostRows();return}
 armed={key:k,until:Date.now()+4000};renderHostRows();
 setTimeout(()=>{if(armed&&armed.key===k&&Date.now()>=armed.until){armed=null;renderHostRows()}},4100);
}
function hostPanel(){
 Snd.music(false);stopTimer();activeTeam=null;armed=null;
 app.innerHTML=`<section class="card"><div class="top"><div><div class="tag">👑 CHẾ ĐỘ CHỦ TRÌ</div> <span class="tag syncTag"></span><h2>Bảng điều khiển 7 đội</h2></div><button class="btn ghost" id="back">Thoát</button></div><div class="statrow"><div class="stat">Tổng đội<b>7</b></div><div class="stat">Đang chơi<b id="playCount">${state.teams.filter(t=>!t.done&&t.stage>=1).length}</b></div><div class="stat">Đã hoàn thành<b id="doneCount">${state.teams.filter(t=>t.done).length}/7</b></div><div class="stat">Tổng điểm<b id="sum">${state.teams.reduce((s,t)=>s+t.score,0)}</b></div></div><h3 style="margin-top:20px">🏆 Bảng xếp hạng trực tiếp</h3><div style="overflow-x:auto"><table><thead><tr><th>Đội</th><th>Điểm</th><th>Trạng thái</th><th>Cập nhật</th><th>Thao tác</th></tr></thead><tbody id="scores">${hostRowsHTML()}</tbody></table></div><div class="grid" style="margin-top:16px"><button class="btn secondary" id="refresh">↻ Cập nhật bảng điểm</button><button class="btn ghost" id="export">Tải bảng điểm CSV</button><button class="btn ghost" id="reset">Đặt lại điểm 7 đội</button></div><div class="notice" style="margin-top:14px">Bảng tự cập nhật ngay khi có đội ghi điểm. <b>Giải phóng</b>: mở khóa đội khi bấm nhầm hoặc máy hỏng, điểm đã làm được giữ nguyên. <b>Đặt lại</b>: xóa điểm của đội đó để chơi lại. Đội chưa vào vẫn hiện 0 điểm, không cần đủ 7 đội.</div></section>`;
 document.getElementById('back').onclick=()=>home();
 document.getElementById('refresh').onclick=async()=>{try{if(DB){const sn=await DB.collection('teams').get();applySnap(sn.docs)}}catch(e){}hostPanel()};
 syncBadge();
 document.getElementById('scores').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)armClick(b.dataset.k)};
 document.getElementById('reset').onclick=()=>armClick('all');
 document.getElementById('export').onclick=async()=>{let csv='Đội,Điểm,Trạng thái\n'+state.teams.map(t=>`${t.name},${t.score},${t.done?'Hoàn thành':'Chưa hoàn thành'}`).join('\n');try{const dl=await window.claude.use('downloads');if(!dl)return;await dl.save({filename:'bang-diem-san-kho-vang.csv',data:'﻿'+csv})}catch(e){}};
}
window.addEventListener('storage',e=>{if(e.key===KEY){state=loadState();if(document.getElementById('scores'))hostPanel();else updateMiniScore()}});
startSync();home();
</script>

</body></html>
