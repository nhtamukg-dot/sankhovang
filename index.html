<div class="wrap">

<script id="sound-engine">
/* ===================================================================
   HỆ THỐNG ÂM THANH TẬP TRUNG – Logistics Challenge
   - Chỉ có 1 kênh nhạc nền: đổi nhạc là nhạc cũ tự dừng, không chồng bài.
   - Không phát gì trước khi người chơi bấm nút bắt đầu.
   - Mặc định dùng Web Audio API (không cần file, không vướng bản quyền).
   - Muốn dùng file nhạc riêng: điền đường dẫn vào FILES bên dưới.
   =================================================================== */
const Snd=(()=>{
 /* ---------- CẤU HÌNH NHẠC NỀN ----------
    '' (để trống)  = dùng nhạc tổng hợp có sẵn.
    'audio/xxx.mp3' = dùng file của bạn (mp3/ogg/wav, tự lặp lại).
    Chỉ dùng nhạc bạn có quyền sử dụng (tự làm, mua bản quyền, hoặc nhạc miễn phí như Pixabay, YouTube Audio Library...). */
 const FILES={
  round1:'',   // Vòng 1 – gameshow vui nhộn, tiết tấu nhanh
  round2:'',   // Vòng 2 – phiêu lưu săn kho báu
  round3:'',   // Vòng 3 – Tết vui tươi rộn ràng
  tension:'',  // Phần tính điểm hòa vốn (hồi hộp)
  victory:''   // Tổng kết / công bố đội thắng
 };
 const MUSIC_BASE=.15, SFX_BASE=.5, TICK_BASE=.32;
 let ctx=null,master,musicG,sfxG,tickG,noiseBuf,curBus=null,busyUntil=0;
 let muted=false,vol=1,role='team',want=null,CT={mo:1,so:1,mv:60,sv:60,q:0,ph:0},cur=null,timer=null,nextT=0,step=0,intenseOn=false,fileEl=null,duckF=1,duckTO=null,vicTO=null;
 const mf=m=>440*Math.pow(2,(m-69)/12);
 /* Quyền phát: nhạc nền chỉ trên máy MC (host); điện thoại đội chỉ có âm báo nhỏ khi MC cho phép */
 function levels(){if(!ctx)return;const k=(role==='host'?1:.5)*CT.sv/100;sfxG.gain.value=SFX_BASE*k;tickG.gain.value=TICK_BASE*k}
 const canSfx=()=>!muted&&!CT.q&&!!CT.so&&(role==='host'||!!CT.ph);
 const canMusic=()=>role==='host'&&!!CT.mo&&!CT.q&&!muted;
 function refresh(){levels();applyMusic();if(!canMusic()){if(cur){stopLoop();stopFile();cur=null}}else if(want&&!cur){const w=want;S.music(w)}}

 function init(){
  try{
   if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=muted?0:vol;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    musicG=ctx.createGain();musicG.gain.value=MUSIC_BASE;musicG.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=SFX_BASE;sfxG.connect(master);
    tickG=ctx.createGain();tickG.gain.value=TICK_BASE;tickG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;levels();
   }
   if(ctx.state==='suspended')ctx.resume();
   return true;
  }catch(e){return false}
 }
 function tone(f,t,dur,type,v,dest,f2){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.01,dur/3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);
 }
 function noise(t,dur,v,type,freq,dest){
  const n=ctx.createBufferSource();n.buffer=noiseBuf;
  const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(dest);n.start(t);n.stop(t+dur+.02);
 }
 function sweep(t,dur,f0,f1,v,dest){
  const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;
  const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+dur*.45);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(dest);n.start(t);n.stop(t+dur+.05);
 }
 function lowpass(freq,dest){const l=ctx.createBiquadFilter();l.type='lowpass';l.frequency.value=freq;l.connect(dest);return l}
 function claps(t,n,span,v,dest){for(let i=0;i<n;i++)noise(t+Math.random()*span,.035+Math.random()*.03,v*(.5+Math.random()*.5),'bandpass',1800+Math.random()*2200,dest)}

 /* ---------- NHẠC NỀN TỔNG HỢP (mỗi chủ đề 1 phong cách) ---------- */
 const kick=(t,v)=>tone(150,t,.16,'sine',v||.9,musicG,42);
 const clap=(t,v)=>noise(t,.12,v||.4,'bandpass',1800,musicG);
 const hat=(t,v)=>noise(t,.04,v||.16,'highpass',7000,musicG);
 const THEMES={
  /* Vòng 1: gameshow vui nhộn, nhanh (C – Am – F – G, 140 BPM) */
  round1:{bpm:140,chords:[[60,64,67],[57,60,64],[60,65,69],[59,62,67]],bass:[36,33,41,43],arp:{0:0,2:1,3:2,6:1,8:2,10:1,11:0,14:2},
   sched(k,t,bar,sd){const T=this;
    if(k%4===0)kick(t);
    if(k===4||k===12)clap(t,.45);
    if(k%2===1||k===2||k===10)hat(t,.18);
    if(k%2===0)tone(mf(T.bass[bar]+(k%4===2?12:0)),t,sd*1.7,'triangle',.5,musicG);
    if(k===2||k===6||k===10||k===14)T.chords[bar].forEach(m=>tone(mf(m-12),t,sd*1.4,'triangle',.07,musicG));
    if(T.arp[k]!==undefined)tone(mf(T.chords[bar][T.arp[k]]+12),t,sd*1.5,'square',.045,musicG)}},
  /* Vòng 2: phiêu lưu – săn kho báu (Dm – Bb – C – Am, 104 BPM) */
  round2:{bpm:104,chords:[[62,65,69],[58,62,65],[60,64,67],[57,60,64]],bass:[38,34,36,33],
   mel:[[74,0,0,77,0,0,81,0,79,0,0,77,0,0,74,0],[74,0,0,77,0,0,82,0,79,0,0,77,0,0,74,0],[72,0,0,76,0,0,79,0,76,0,0,72,0,0,79,0],[69,0,0,72,0,0,76,0,81,0,0,79,0,76,72,0]],
   sched(k,t,bar,sd){const T=this;
    if(k===0||k===6||k===10)tone(112,t,.22,'sine',.75,musicG,58);
    if(k===8)noise(t,.05,.3,'bandpass',2400,musicG);
    if(k%2===0)noise(t,.03,.1,'highpass',8000,musicG);
    if(k===0||k===6||k===8||k===14)tone(mf(T.bass[bar]),t,sd*2.4,'triangle',.5,musicG);
    if(k===0)T.chords[bar].forEach(m=>tone(mf(m),t,sd*10,'triangle',.05,musicG));
    const n=T.mel[bar][k];if(n){tone(mf(n),t,sd*2.6,'triangle',.13,musicG);tone(mf(n+12),t,sd*1.2,'sine',.04,musicG)}}},
  /* Hòa vốn / hồi hộp: bass dồn dập, đồng hồ điểm nhịp (A – A – Bb – Ab, 120 BPM) */
  tension:{bpm:120,bass:[33,33,34,32],
   sched(k,t,bar,sd){const T=this;
    if(k%2===0)tone(mf(T.bass[bar]),t,sd*1.6,'sawtooth',.2,lowpass(520,musicG));
    if(k===0||k===8)kick(t,.8);
    if(k%4===2)tone(1900,t,.03,'sine',.12,musicG);
    if(k%2===1)hat(t,.12);
    if(k===12||k===14)tone(mf(81+bar),t,sd*1.5,'square',.025,musicG);
    if(k===0)[mf(57),mf(63)].forEach(f=>tone(f,t,sd*14,'triangle',.04,musicG))}},
  /* Vòng 3: Tết hiện đại – ngũ cung, mõ, trống, đàn (C – Am – F – G, 128 BPM) */
  round3:{bpm:128,chords:[[60,64,67],[57,60,64],[65,69,72],[67,71,74]],bass:[36,33,41,43],
   mel:[[72,0,74,0,76,0,79,0,81,0,79,0,76,0,74,0],[76,0,79,0,81,0,84,0,81,0,79,0,76,0,72,0],[77,0,81,0,84,0,81,0,79,0,77,0,76,0,74,0],[79,0,83,0,86,0,83,0,79,0,76,0,74,0,79,0]],
   sched(k,t,bar,sd){const T=this;
    if(k===0||k===3||k===6||k===8||k===11||k===14)tone(160,t,.13,'sine',.7,musicG,70);
    if(k===0&&bar%2===0)noise(t,.35,.22,'highpass',6000,musicG);
    if(k%2===0)tone(k%4===0?1250:1000,t,.05,'sine',.12,musicG);
    if(k%4===0)tone(mf(T.bass[bar]),t,sd*3,'triangle',.45,musicG);
    if(k===2||k===10)T.chords[bar].forEach(m=>tone(mf(m),t,sd*2,'triangle',.05,musicG));
    const n=T.mel[bar][k];if(n){tone(mf(n),t,sd*3,'triangle',.12,musicG);tone(mf(n+12),t,sd*1.5,'sine',.05,musicG)}}},
  /* Tổng kết – chiến thắng hoành tráng (I – V – vi – IV, 128 BPM) */
  victory:{bpm:128,chords:[[60,64,67],[59,62,67],[57,60,64],[60,65,69]],bass:[36,43,33,41],
   sched(k,t,bar,sd){const T=this;
    if(k%4===0)kick(t);
    if(k===4||k===12)clap(t,.5);
    if(k%4===2)noise(t,.09,.14,'highpass',7500,musicG);
    if(k%2===0)tone(mf(T.bass[bar]+(k%4===2?12:0)),t,sd*1.7,'triangle',.5,musicG);
    if(k===0||k===6||k===10)T.chords[bar].forEach(m=>tone(mf(m),t,sd*3,'sawtooth',.035,lowpass(2600,musicG)));
    if(k%2===0)tone(mf(T.chords[bar][(k/2)%3]+24),t,sd*1.4,'square',.035,musicG)}}
 };
 function pump(){
  if(!ctx||!cur||!THEMES[cur])return;
  const T=THEMES[cur],sd=60/T.bpm/4;
  if(nextT<ctx.currentTime-.2)nextT=ctx.currentTime+.05;
  while(nextT<ctx.currentTime+.18){
   const bar=(step>>4)&3,k=step&15;
   T.sched(k,nextT,bar,sd);
   if(intenseOn){if(k%4===0)tone(65,nextT,.14,'sine',.8,musicG,40);if(k%2===1)noise(nextT,.03,.14,'highpass',8000,musicG)}
   nextT+=sd;step=(step+1)%64;
  }
 }
 function stopLoop(){if(timer){clearInterval(timer);timer=null}}
 function stopFile(){if(fileEl){const a=fileEl;fileEl=null;a.onerror=null;try{a.pause()}catch(e){}}}
 function startSynth(name){stopLoop();cur=name;step=0;nextT=ctx.currentTime+.06;timer=setInterval(pump,40)}
 function playFile(name){
  const a=new Audio(FILES[name]);a.loop=name!=='victory';a.preload='auto';fileEl=a;a.muted=muted;applyMusic();
  const fb=()=>{if(fileEl===a){fileEl=null;if(cur===name&&ctx)startSynth(name)}};
  a.onerror=fb;const p=a.play();if(p&&p.catch)p.catch(fb);
 }
 function applyMusic(){
  const lv=duckF*(intenseOn?1.25:1);
  if(ctx){const t=ctx.currentTime;musicG.gain.cancelScheduledValues(t);musicG.gain.setTargetAtTime(MUSIC_BASE*lv*CT.mv/100,t,.05)}
  if(fileEl)fileEl.volume=Math.min(1,.55*vol*lv*CT.mv/100);
 }
 function duck(dur){
  if(!ctx)return;duckF=.4;applyMusic();clearTimeout(duckTO);
  duckTO=setTimeout(()=>{duckF=1;applyMusic()},Math.max(300,dur*1000));
 }
 function setIntense(on){intenseOn=!!on;applyMusic()}

 /* ---------- HIỆU ỨNG ÂM THANH (mỗi lần chỉ 1 hiệu ứng, cái mới cắt cái cũ) ---------- */
 function play(fn,dur,o){
  o=o||{};if(!(o.force||canSfx())||!init())return;
  const now=ctx.currentTime;let t=now+.01;
  if(busyUntil>now&&!o.layer){t=busyUntil}
  else if(curBus&&!o.layer){const g=curBus;g.gain.cancelScheduledValues(now);g.gain.setTargetAtTime(0,now,.015);setTimeout(()=>{try{g.disconnect()}catch(e){}},250)}
  const bus=ctx.createGain();bus.gain.value=1;bus.connect(sfxG);
  if(!o.layer)curBus=bus;
  try{fn(t,bus)}catch(e){}
  if(o.protect)busyUntil=t+dur;
  duck(dur+(t-now));
 }
 const FX={
  /* Mở khóa kho báu: chìa khóa – lách cách – cửa kẽo kẹt – lấp lánh */
  open(t,b){
   tone(2400,t,.08,'triangle',.3,b,1800);noise(t,.03,.25,'highpass',6000,b);
   tone(300,t+.18,.06,'square',.25,b,120);noise(t+.18,.04,.3,'bandpass',900,b);
   tone(180,t+.3,.45,'sawtooth',.07,lowpass(700,b),330);
   [784,988,1175,1568,1976,2349].forEach((f,i)=>{tone(f,t+.75+i*.07,.4,'sine',.22,b);tone(f*2,t+.75+i*.07,.2,'triangle',.08,b)});
  },

 function setPos(nx,ny){if(locked)return;x=Math.max(0,Math.min(10,nx));y=Math.max(0,Math.min(10,ny));document.getElementById('sx').value=x;document.getElementById('sy').value=y;draw()}
 map.onpointerdown=e=>{if(locked)return;map.setPointerCapture(e.pointerId);move(e)};map.onpointermove=e=>{if(e.buttons)move(e)};
 function move(e){let r=map.getBoundingClientRect();setPos(Math.round((((e.clientX-r.left)/r.width*320-20)/28)*20)/20,Math.round(((300-(e.clientY-r.top)/r.height*320)/28)*20)/20)}
 document.getElementById('sx').oninput=e=>setPos(+e.target.value,y);document.getElementById('sy').oninput=e=>setPos(x,+e.target.value);
 function finish(){if(locked)return;locked=true;stopTimer();document.getElementById('sx').disabled=document.getElementById('sy').disabled=true;document.getElementById('lock').disabled=true;
 let dd=Math.hypot(x-gx,y-gy),pts=dd<=.15?5:dd<=.3?4:dd<=.6?3:dd<=1?2:dd<=1.5?1:0,bonus=timeLeft>12&&pts===5?1:0;addPoints(pts+bonus,'Định vị kho');Snd[pts?'correct':'wrong'](pts===5?(bonus?2:1):0);draw();
 document.getElementById('fb').innerHTML=`<div class="feedback"><b>${pts+bonus} điểm!</b> ${bonus?'Có thêm 1 điểm thưởng tốc độ. ':''}Đáp án gần đúng: X = ${fmt(gx,2)}, Y = ${fmt(gy,2)}; Z = ${fmt(ZS,3)} tấn·km/ngày. Bạn lệch ${fmt(dd,2)} đơn vị so với đáp án nên được ${pts} điểm cơ bản${bonus?' + 1 điểm tốc độ':''}.</div><button class="btn" id="next">Qua nhiệm vụ 2 ➜</button>`;document.getElementById('next').onclick=()=>{Snd.ch2();breakEven()}}
 document.getElementById('lock').onclick=finish;draw();startTimer(20,()=>{document.getElementById('lock').textContent='Hết giờ – chốt kết quả';finish()});
}
function breakEven(){
 stage=2;setStage(2);answerLocked=false;let x=1,fin=false;
 app.innerHTML=`<section class="card">${header(2,'⚖️ Cuộc đua hòa vốn')}<p class="muted">Tính điểm hòa vốn x* (càng gần đáp án càng được nhiều điểm) (kho A và kho C có tổng chi phí bằng nhau) trong Excel, rồi nhập kết quả vào ô bên dưới. Đội có 20 giây!</p><div class="question">Ở mức nhu cầu nào, kho A và kho C có chi phí bằng nhau?</div><div class="sliderrow">Hệ số x* <input id="xin" type="number" step="0.001" placeholder="Nhập hệ số x* từ Excel..." inputmode="decimal"></div><div id="bars"></div><div class="top"><span class="timer" id="timer">⏱ 20s</span><span class="pill">Tối đa 5 điểm</span></div><button class="btn" id="lock">Chốt điểm hòa vốn 🎯</button><div id="fb"></div></section>`;
 function costs(i,v){return FF[i]+V[i]*v}
 function draw(){if(!document.getElementById('bars'))return;let vals=fin?[608.5,629.1,608.5]:LN.map((_,i)=>costs(i,x)),max=Math.max(...vals);document.getElementById('bars').innerHTML=vals.map((v,i)=>`<div style="margin:12px 0"><div class="top"><b>${LN[i]}</b><span>${fmt(v,1)} triệu</span></div><div class="progress"><i style="width:${v/max*100}%;background:${i===vals.indexOf(Math.min(...vals))?'var(--cyan)':'var(--gold)'}"></i></div></div>`).join('')}
 draw();
 function animateToBE(){let from=x,t0=performance.now(),dur=1200;(function step(t){if(!document.getElementById('bars'))return;let p=Math.min(1,(t-t0)/dur);x=from+(BE-from)*(1-Math.pow(1-p,3));draw();if(p<1)requestAnimationFrame(step);else{x=BE;fin=true;draw()}})(t0)}
 function finish(){if(answerLocked)return;answerLocked=true;stopTimer();let inp=document.getElementById('xin');document.getElementById('lock').disabled=true;inp.disabled=true;let v=parseFloat(String(inp.value).replace(',','.')),df=isNaN(v)?99:Math.abs(v-BE),pts=df<=.02?5:df<=.05?4:df<=.1?3:df<=.25?2:df<=.5?1:0,ok=pts>0,bonus=timeLeft>12&&pts===5?1:0;addPoints(pts+bonus,'Điểm hòa vốn');if(ok)Snd.gold(bonus);else Snd.wrong();animateToBE();document.getElementById('fb').innerHTML=`<div class="feedback"><b>${pts+bonus} điểm!</b> ${pts===5?'Chính xác! ':ok?'Khá gần đúng! ':'Chưa chính xác. '}Đáp án chuẩn: 2,004 lần (làm tròn 2,00 lần) – Tại mức này tổng chi phí kho A và kho C bằng nhau ở 608,5 triệu/năm. ${bonus?'Thưởng tốc độ +1 điểm.':''}</div><button class="btn" id="next">Qua nhiệm vụ 3 ➜</button>`;document.getElementById('next').onclick=()=>{Snd.ch3();finalChoice()}}
 document.getElementById('lock').onclick=finish;startTimer(20,finish);
}
function finalChoice(){
 stage=3;setStage(3);answerLocked=false;
 app.innerHTML=`<section class="card">${header(3,'👑 Quyết định của giám đốc')}<div class="tag">THỬ THÁCH CUỐI · 20 GIÂY</div><div class="question">Với nhu cầu hiện tại (x = 1), đội sẽ chọn kho nào để có tổng chi phí thấp nhất?</div><div id="opts"></div><div class="top"><span class="timer" id="timer">⏱ 20s</span><span class="pill">2 điểm + 1 điểm tốc độ</span></div><div id="fb"></div></section>`;
 LN.forEach((n,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=n+' – '+fmt(FF[i]+V[i],1)+' triệu đồng';b.onclick=()=>choose(i);document.getElementById('opts').appendChild(b)});
 function choose(i){if(answerLocked)return;answerLocked=true;stopTimer();let correct=i===2,bonus=timeLeft>10&&correct?1:0,pts=correct?2+bonus:0;addPoints(pts,'Chọn vị trí kho');if(correct)Snd.correct(bonus?2:1);else Snd.wrong();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===2)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('fb').innerHTML=`<div class="feedback"><b>${correct?'Chính xác! +'+pts+' điểm':'Chưa chính xác – +0 điểm'}</b> Kho C – Hóc Môn có tổng chi phí thấp nhất ở nhu cầu hiện tại (${fmt(FF[2]+V[2],1)} triệu đồng). ${bonus?'Bạn nhận thêm 1 điểm tốc độ!':''}</div><button class="btn" id="finish">Nộp kết quả 🏆</button>`;document.getElementById('finish').onclick=endGame}
 startTimer(20,()=>choose(-1));
}
function endGame(){stopTimer();team().done=true;team().stage=3;if(team().startTs)team().dur=Date.now()-team().startTs;save();pushTeam(team());let s=team().score,rank=s>=13?'🏆 Chiến thần logistics':s>=9?'🥇 Chuyên gia kho vận':s>=5?'📦 Nhà thám hiểm kho':'🐣 Tân binh logistics';
 if(s>=15)Snd.jackpot();else Snd.victory();
 app.innerHTML=`<section class="card hero"><div class="emoji">🎉🏆</div><div class="tag">${team().name} ĐÃ HOÀN THÀNH</div><h2>${rank}</h2><div class="score">${s} điểm</div><div class="muted">⏱ Thời gian hoàn thành: ${fmtDur(team().dur)} · Hạng hiện tại: <b id="myRank">${rankOf(activeTeam)}</b></div><div id="endBoard" style="text-align:left;max-width:560px;margin:14px auto">${boardHTML(activeTeam)}</div><p>Đội đã hoàn thành 3 thử thách của vòng Săn kho vàng. Hãy chờ chủ trì công bố kết quả chung cuộc!</p><button class="btn" id="home">Về màn hình đầu</button></section>`;
 document.getElementById('home').onclick=home}
function hostPanel(){
 stopTimer();armed=null;clearTimeout(armedTO);hostMode=true;Snd.setRole('host');applyPause();activeTeam=null;
 const rows=hostRowsHTML;
 app.innerHTML=`<section class="card"><div class="top"><div><div class="tag">👑 CHẾ ĐỘ CHỦ TRÌ</div> <span class="tag syncTag"></span><h2>Bảng điều khiển 7 đội</h2></div><button class="btn ghost" id="back">Thoát</button></div><div class="statrow"><div class="stat">Tổng đội<b>7</b></div><div class="stat">Đang chơi<b id="playCount">${state.teams.filter(t=>!t.done&&t.stage>=1).length}</b></div><div class="stat">Đã hoàn thành<b id="doneCount">${state.teams.filter(t=>t.done).length}/7</b></div><div class="stat">Tổng điểm<b id="sum">${state.teams.reduce((s,t)=>s+t.score,0)}</b></div></div><div id="podium">${(lastPodium=podiumHTML())}</div><div class="statrow" id="awards" style="margin-top:14px"></div><h3 style="margin-top:20px">🏆 Bảng xếp hạng trực tiếp <span class="muted" style="font-size:13px;font-weight:500">(điểm cao hơn xếp trên; bằng điểm thì đội nhanh hơn xếp trên)</span></h3><div style="overflow-x:auto"><table><thead><tr><th>Đội</th><th>Điểm</th><th>Thời gian</th><th>Trạng thái</th><th>Cập nhật</th><th>Thao tác</th></tr></thead><tbody id="scores">${rows()}</tbody></table></div><div class="grid" style="margin-top:16px"><button class="btn secondary" id="refresh">↻ Cập nhật bảng điểm</button><button class="btn ghost" id="export">Tải bảng điểm CSV</button><button class="btn ghost" id="reset">Đặt lại điểm 7 đội</button></div><div class="notice" style="margin-top:14px">Bảng tự cập nhật ngay khi có đội ghi điểm hoặc chuyển thử thách, không cần bấm làm mới. Khi có đội hoàn thành, màn hình chủ trì sẽ hiện thông báo kèm nhạc báo.</div></section>${consoleHTML()}`;
 document.getElementById('back').onclick=home;document.getElementById('refresh').onclick=hostPanel;syncBadge();wireConsole();pushCtl();renderAwards();
 document.getElementById('reset').onclick=()=>{
  if(armed!=='all'){setArmed('all');return}
  setArmed(null);state=blank();save();state.teams.forEach(pushTeam);hostPanel();
 };
 document.getElementById('scores').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cancel){setArmed(null);return}
  const id=+b.dataset.rst;if(!id)return;
  if(armed!==id){setArmed(id);return}
  setArmed(null);resetTeam(id);renderHostRows();
 };
 document.getElementById('export').onclick=()=>{let csv='Đội,Điểm,Thời gian,Trạng thái\n'+state.teams.slice().sort(rankCmp).map(t=>`${t.name},${t.score},${fmtDur(t.dur)},${t.done?'Hoàn thành':'Chưa hoàn thành'}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='bang-diem-san-kho-vang.csv';a.click();URL.revokeObjectURL(a.href)};
}
window.addEventListener('storage',e=>{if(e.key===KEY){state=loadState();if(document.getElementById('scores'))hostPanel();else updateMiniScore()}});
startSync();home();
</script>
</body>
</html>
